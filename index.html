    <style>
        body { margin:0; padding:0; font-family: Arial, sans-serif; background:#f0f0f0; }
        #map { height: 100vh; } 
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            min-width: 260px;
        }
        #controls h3 { margin: 0 0 10px; font-size: 1.1em; }
        button {
            margin: 4px 0;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f8f8f8;
            cursor: pointer;
        }
        button:hover { background: #e0e0e0; }
        #totalDistance {
            font-weight: bold;
            color: #d32f2f;
            margin: 10px 0 6px;
            font-size: 1.15em;
        }
        .distance-label {
            background: rgba(0,0,0,0.65);
            color: white;
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 11px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <h3>Քարտեզի գործիքներ</h3>
    <div id="totalDistance">Ընդհանուր հեռավորություն: 0 կմ</div>
    <button onclick="clearPath()">Մաքրել ուղին</button>
    <button onclick="undoLastPoint()">← Հեռացնել վերջին կետը</button>
    <button id="toggleLabelsBtn" onclick="toggleLabels()">Labels միացնել/անջատել</button>
    <button id="toggleAttractionsBtn" onclick="toggleAttractions()">Տեսարժան վայրեր ցույց տալ/թաքցնել</button>
    <p style="font-size:0.85em; color:#555; margin-top:12px;">
        Սեղմիր քարտեզի վրա՝ սովորական կետ ավելացնելու համար<br>
        Տեսարժան վայրերը <strong>կանաչ</strong> նշաններով են
    </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Գլոբալ փոփոխականներ
let map, pathLine, markers = [], labels = [], showLabels = true;
let attractionsLayer = L.layerGroup();
let showAttractions = true;

// Օգտատիրոջ կետերի համար՝ ստանդարտ (կարմիր/նարնջագույն)
const userIcon = L.Icon.Default.prototype;

// Տեսարժան վայրերի համար՝ կանաչ (green) և մի փոքր ավելի մեծ
const attractionIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
    iconSize: [32, 52],       // ավելի մեծ՝ ավելի լավ տարբերվի
    iconAnchor: [16, 52],
    popupAnchor: [1, -48],
    shadowSize: [52, 52]
});

// Քարտեզ
map = L.map('map', { zoomControl: true }).setView([40.1872, 44.5152], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
}).addTo(map);

// Պաթ գիծ
pathLine = L.polyline([], { color: '#e91e63', weight: 5, opacity: 0.85 }).addTo(map);

// Տեսարժան վայրեր (նույն ցանկը)
const attractions = [
    { name: "Հանրապետության հրապարակ", lat: 40.1772, lng: 44.5122, desc: "Երևանի կենտրոնը, գեղեցիկ շատրվաններով" },
    { name: "Կասկադ", lat: 40.1855, lng: 44.5150, desc: "Հայտնի աստիճաններ՝ արվեստի կենտրոնով" },
    { name: "Ծիծեռնակաբերդ", lat: 40.1870, lng: 44.4900, desc: "Հայոց ցեղասպանության հուշահամալիր" },
    { name: "Մատենադարան", lat: 40.1920, lng: 44.5180, desc: "Հին ձեռագրերի ինստիտուտ-թանգարան" },
    { name: "Մայր Հայաստան", lat: 40.1950, lng: 44.5320, desc: "Հուշարձան՝ հիանալի տեսարանով" },
    { name: "Օպերա և Բալետ", lat: 40.1860, lng: 44.5145, desc: "Ալեքսանդր Թամանյանի գլուխգործոցը" },
    { name: "Կապույտ մզկիթ", lat: 40.1785, lng: 44.5060, desc: "18-րդ դարի մզկիթ Երևանում" },
    { name: "Վերնիսաժ", lat: 40.1810, lng: 44.5140, desc: "Հայկական արհեստների շուկա" }
];

function addAttractions() {
    attractionsLayer.clearLayers();
    if (!showAttractions) return;

    attractions.forEach(place => {
        L.marker([place.lat, place.lng], { icon: attractionIcon })
            .bindPopup(`<b>${place.name}</b><br>${place.desc}`)
            .addTo(attractionsLayer);
    });
    attractionsLayer.addTo(map);
}

addAttractions();

// Օգտատիրոջ կետ ավելացնել (ստանդարտ icon-ով)
map.on('click', function(e) {
    addPoint(e.latlng);
});

function addPoint(latlng) {
    const marker = L.marker(latlng, { 
        draggable: true,
        icon: userIcon           // ← default կարմիր
    }).addTo(map);

    marker.on('dragend', updatePath);
    marker.bindPopup("Քո կետը").openPopup();

    markers.push(marker);
    updatePath();

    if (markers.length >= 2) {
        const prev = markers[markers.length-2].getLatLng();
        const dist = prev.distanceTo(latlng) / 1000;
        const label = L.marker(latlng, {
            icon: L.divIcon({
                className: 'distance-label',
                html: dist.toFixed(2) + ' կմ',
                iconSize: [80, 30],
                iconAnchor: [40, -10]
            }),
            interactive: false
        }).addTo(map);
        labels.push(label);
    }
}

// մնացած ֆունկցիաները նույնն են (updatePath, clearPath, undoLastPoint, toggleLabels, toggleAttractions)
function updatePath() {
    if (markers.length < 1) return;

    const latlngs = markers.map(m => m.getLatLng());
    pathLine.setLatLngs(latlngs);

    let total = 0;
    let segmentDistances = [];

    for (let i = 1; i < latlngs.length; i++) {
        const d = latlngs[i-1].distanceTo(latlngs[i]);
        total += d;
        segmentDistances.push(d / 1000);
    }

    const unit = total < 1000 ? 'մ' : 'կմ';
    const value = total < 1000 ? total.toFixed(0) : (total/1000).toFixed(2);
    document.getElementById('totalDistance').innerText =
        `Ընդհանուր հեռավորություն: ${value} ${unit}`;

    if (showLabels) {
        labels.forEach((label, i) => {
            const dist = segmentDistances[i];
            label.setLatLng(markers[i+1].getLatLng());
            label.setIcon(L.divIcon({
                className: 'distance-label',
                html: dist.toFixed(2) + ' կմ',
                iconSize: [80, 30],
                iconAnchor: [40, -10]
            }));
        });
    }

    if (markers.length > 0) {
        const last = markers[markers.length-1];
        last.setPopupContent(`Ընդհանուր՝ ${value} ${unit}<br>Կետ #${markers.length}`);
    }
}

function clearPath() {
    markers.forEach(m => map.removeLayer(m));
    labels.forEach(l => map.removeLayer(l));
    markers = [];
    labels = [];
    pathLine.setLatLngs([]);
    document.getElementById('totalDistance').innerText = "Ընդհանուր հեռավորություն: 0 կմ";
}

function undoLastPoint() {
    if (markers.length === 0) return;
    const lastMarker = markers.pop();
    map.removeLayer(lastMarker);
    if (labels.length > 0) {
        const lastLabel = labels.pop();
        map.removeLayer(lastLabel);
    }
    updatePath();
}

function toggleLabels() {
    showLabels = !showLabels;
    if (!showLabels) {
        labels.forEach(l => map.removeLayer(l));
    } else {
        updatePath();
    }
    document.getElementById('toggleLabelsBtn').innerText =
        showLabels ? "Labels անջատել" : "Labels միացնել";
}

function toggleAttractions() {
    showAttractions = !showAttractions;
    if (showAttractions) {
        addAttractions();
        document.getElementById('toggleAttractionsBtn').innerText = "Տեսարժան վայրեր թաքցնել";
    } else {
        attractionsLayer.clearLayers();
        document.getElementById('toggleAttractionsBtn').innerText = "Տեսարժան վայրեր ցույց տալ";
    }
}
</script>
</body>
</html>
